name: 02_interviews checks

on:
  pull_request:
    paths: ["02_interviews/**", ".github/workflows/02-interviews.yml"]
  push:
    branches: [main]
    paths: ["02_interviews/**", ".github/workflows/02-interviews.yml"]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_interviews
    env:
      DEV_ADMIN_EMAIL: admin@example.test
      DEV_ADMIN_PASSWORD: correct-horse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: 02_interviews/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02_interviews/frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: 02_interviews/backend
      - run: npm ci
        working-directory: 02_interviews/frontend
      - run: npm ci
        working-directory: 02_interviews/frontend/canvas-sync
      - run: make test-backend
      - run: make test-frontend
      - run: make build-frontend
      - run: make typecheck-canvas
      - run: make test-canvas
      - run: make contract-check

  browser:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: 02_interviews
    env:
      DEV_ADMIN_EMAIL: admin@example.test
      DEV_ADMIN_PASSWORD: correct-horse
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 02_interviews/frontend/package-lock.json
      - run: npm ci
        working-directory: 02_interviews/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: 02_interviews/frontend
      - run: cp .env.example .env && docker compose up -d --build --wait
      - run: CANVAS_POC_PORT=8091 python3 canvas-poc/server.py > canvas-poc.log 2>&1 & POC_PID=$!; trap 'kill $POC_PID' EXIT; CANVAS_POC_URL=http://127.0.0.1:8091 make e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 02-interviews-browser-diagnostics
          path: |
            02_interviews/compose.log
            02_interviews/frontend/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v
