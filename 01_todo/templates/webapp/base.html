{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todo{% endblock %} · Todo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-sm border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'active' %}">Todo</a>
      <div class="navbar-nav gap-sm-2">
        <a class="nav-link {% if request.resolver_match.url_name == 'active' %}active{% endif %}" href="{% url 'active' %}">Tasks</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'completed' %}active{% endif %}" href="{% url 'completed' %}">Completed</a>
        <a class="nav-link {% if request.resolver_match.url_name == 'trash' %}active{% endif %}" href="{% url 'trash' %}">Trash</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
